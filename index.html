<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIA-18 | Sistema Inteligente de Armamento y Municiones</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .scan-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: #10B981;
            box-shadow: 0 0 15px #10B981;
            animation: scan 2s infinite ease-in-out;
        }
        @keyframes scan {
            0% { top: 10%; }
            50% { top: 90%; }
            100% { top: 10%; }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col pb-20 md:pb-0">

    <!-- Encabezado -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-40 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="bg-emerald-600 text-slate-950 p-2 rounded-lg font-bold text-xl">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <div>
                <h1 class="font-extrabold tracking-wider text-emerald-400 text-lg md:text-xl">SIA-18</h1>
                <p class="text-xs text-slate-400 hidden sm:block">Control Táctico de Inventario & IA</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <label for="currentVault" class="text-xs text-slate-400 hidden md:inline"><i class="fa-solid fa-warehouse mr-1"></i> Almacén Vista:</label>
            <select id="currentVault" onchange="renderInventory()" class="bg-slate-800 border border-slate-700 text-emerald-400 text-xs md:text-sm rounded-lg p-2 focus:ring-emerald-500 font-semibold">
                <option value="ALL">TODOS (18 Almacenes)</option>
            </select>
        </div>
    </header>

    <!-- Alerta IA -->
    <div id="aiAnomalyBox" class="bg-amber-950/80 border-b border-amber-600/50 text-amber-200 px-4 py-3 flex items-start space-x-3 text-xs md:text-sm hidden">
        <i class="fa-solid fa-triangle-exclamation text-amber-400 text-lg mt-0.5"></i>
        <div class="flex-1">
            <span class="font-bold text-amber-400 uppercase tracking-wide">Alerta IA:</span>
            <p id="aiAnomalyText"></p>
        </div>
        <button onclick="dismissAnomaly()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <!-- Contenido Principal -->
    <main class="flex-1 p-3 md:p-6 max-w-7xl w-full mx-auto grid grid-cols-1 md:grid-cols-3 gap-6">

        <!-- Panel Izquierdo -->
        <div class="md:col-span-1 space-y-6">
            
            <!-- Acciones -->
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-md space-y-3">
                <h2 class="text-sm font-semibold uppercase text-slate-400 flex items-center">
                    <i class="fa-solid fa-right-left text-emerald-400 mr-2"></i> Operaciones
                </h2>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="openTransactionModal('ENTRADA')" class="bg-emerald-600 text-slate-950 font-bold p-3 rounded-lg flex flex-col items-center">
                        <i class="fa-solid fa-arrow-down-to-bracket text-lg"></i><span>ENTRADA</span>
                    </button>
                    <button onclick="openTransactionModal('SALIDA')" class="bg-rose-600 text-slate-100 font-bold p-3 rounded-lg flex flex-col items-center">
                        <i class="fa-solid fa-arrow-up-from-bracket text-lg"></i><span>SALIDA</span>
                    </button>
                    <button onclick="openTransactionModal('TRASLADO')" class="col-span-2 bg-slate-800 text-cyan-400 border border-cyan-500/30 font-bold p-2.5 rounded-lg flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-arrows-rotate"></i><span>TRASLADO ENTRE ALMACENES</span>
                    </button>
                </div>
            </div>

            <!-- Chat IA -->
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-md flex flex-col h-[320px]">
                <h2 class="text-sm font-semibold text-emerald-400 flex items-center border-b border-slate-800 pb-2">
                    <i class="fa-solid fa-brain mr-2"></i> Asistente Operativo IA
                </h2>
                <div id="chatHistory" class="flex-1 overflow-y-auto my-2 space-y-2 text-xs">
                    <div class="bg-slate-800/80 p-2.5 rounded-lg border-l-2 border-emerald-500">
                        <p class="font-bold text-emerald-400">IA SIA-18:</p>
                        <p class="text-slate-300">Sistemas listos. Pregunta por stock o asignaciones.</p>
                    </div>
                </div>
                <form onsubmit="handleAIChat(event)" class="flex space-x-2 pt-2 border-t border-slate-800">
                    <input type="text" id="aiQueryInput" placeholder="Ej: Stock de 9mm..." class="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200">
                    <button type="submit" class="bg-emerald-600 text-slate-950 px-3 py-2 rounded-lg"><i class="fa-solid fa-paper-plane"></i></button>
                </form>
            </div>
        </div>

        <!-- Panel Derecho: Tablas -->
        <div class="md:col-span-2 space-y-6">
            
            <div class="grid grid-cols-3 gap-3">
                <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl text-center">
                    <p class="text-[10px] text-slate-400 uppercase">Armas</p>
                    <p id="totalWeaponsCount" class="text-xl font-bold text-emerald-400">0</p>
                </div>
                <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl text-center">
                    <p class="text-[10px] text-slate-400 uppercase">Municiones</p>
                    <p id="totalAmmoCount" class="text-xl font-bold text-cyan-400">0</p>
                </div>
                <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl text-center">
                    <p class="text-[10px] text-slate-400 uppercase">Almacenes</p>
                    <p class="text-xl font-bold text-amber-400">18</p>
                </div>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-md">
                <div class="flex space-x-2 border-b border-slate-800 w-full mb-4">
                    <button onclick="switchTab('inventory')" id="tabBtnInventory" class="pb-2 px-3 text-xs font-bold border-b-2 border-emerald-500 text-emerald-400">Inventario</button>
                    <button onclick="switchTab('history')" id="tabBtnHistory" class="pb-2 px-3 text-xs font-bold border-b-2 border-transparent text-slate-400">Historial</button>
                </div>

                <!-- Tabla Inventario -->
                <div id="inventoryTabView" class="overflow-x-auto">
                    <table class="w-full text-left text-xs border-collapse">
                        <thead>
                            <tr class="bg-slate-800/80 text-slate-400 uppercase text-[10px]">
                                <th class="p-2">Almacén</th><th class="p-2">Ítem</th><th class="p-2">Serial/Lote</th><th class="p-2 text-right">Cant.</th>
                            </tr>
                        </thead>
                        <tbody id="inventoryTableBody" class="divide-y divide-slate-800 text-slate-300"></tbody>
                    </table>
                </div>

                <!-- Tabla Historial -->
                <div id="historyTabView" class="overflow-x-auto hidden">
                    <table class="w-full text-left text-xs border-collapse">
                        <thead>
                            <tr class="bg-slate-800/80 text-slate-400 uppercase text-[10px]">
                                <th class="p-2">Fecha</th><th class="p-2">Tipo</th><th class="p-2">Ruta</th><th class="p-2">Ítem</th><th class="p-2">Cant.</th>
                            </tr>
                        </thead>
                        <tbody id="historyTableBody" class="divide-y divide-slate-800 text-slate-300"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Formulario Movimientos -->
    <div id="transModal" class="fixed inset-0 bg-slate-950/80 flex items-center justify-center hidden z-50 p-3">
        <div class="bg-slate-900 border border-slate-700 rounded-xl w-full max-w-md p-5 space-y-4">
            <h3 id="modalTitle" class="text-base font-bold text-emerald-400">OPERACIÓN</h3>
            <form onsubmit="submitTransaction(event)" class="space-y-3 text-xs">
                <input type="hidden" id="transType">
                
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="text-slate-400">Origen</label><select id="modalSourceVault" class="w-full bg-slate-950 border border-slate-700 p-2 text-slate-200 rounded"></select></div>
                    <div id="destVaultContainer" class="hidden"><label class="text-slate-400">Destino</label><select id="modalDestVault" class="w-full bg-slate-950 border border-slate-700 p-2 text-slate-200 rounded"></select></div>
                </div>

                <div>
                    <label class="text-slate-400">Categoría</label>
                    <select id="itemCategory" class="w-full bg-slate-950 border border-slate-700 p-2 text-slate-200 rounded">
                        <option value="Arma Corta">Arma Corta</option><option value="Arma Larga">Arma Larga</option><option value="Munición">Munición</option>
                    </select>
                </div>
                
                <div><label class="text-slate-400">Ítem</label><input type="text" id="itemName" required class="w-full bg-slate-950 border border-slate-700 p-2 text-slate-200 rounded"></div>
                
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-slate-400">Código</label>
                        <div class="flex space-x-1">
                            <input type="text" id="itemCode" required class="w-full bg-slate-950 border border-slate-700 p-2 text-slate-200 rounded">
                            <button type="button" onclick="document.getElementById('scannerModal').classList.remove('hidden')" class="bg-slate-800 p-2 rounded text-emerald-400"><i class="fa-solid fa-qrcode"></i></button>
                        </div>
                    </div>
                    <div><label class="text-slate-400">Cantidad</label><input type="number" id="itemQty" required min="1" value="1" class="w-full bg-slate-950 border border-slate-700 p-2 text-slate-200 rounded"></div>
                </div>

                <div><label class="text-slate-400">Oficial</label><input type="text" id="transUser" required class="w-full bg-slate-950 border border-slate-700 p-2 text-slate-200 rounded"></div>

                <div class="flex space-x-2 pt-2">
                    <button type="button" onclick="document.getElementById('transModal').classList.add('hidden')" class="w-1/2 bg-slate-800 py-2 rounded text-slate-300">Cancelar</button>
                    <button type="submit" class="w-1/2 bg-emerald-600 py-2 rounded text-slate-950 font-bold">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Escáner Simulado -->
    <div id="scannerModal" class="fixed inset-0 bg-slate-950/90 flex items-center justify-center hidden z-50 p-3">
        <div class="bg-slate-900 border border-emerald-500/50 rounded-xl w-full max-w-sm p-4 text-center space-y-4">
            <h4 class="text-xs font-bold text-emerald-400 uppercase">Escáner Táctico</h4>
            <div class="relative w-full h-48 bg-slate-950 border border-slate-800 flex items-center justify-center overflow-hidden">
                <div class="scan-line"></div>
                <i class="fa-solid fa-barcode text-slate-700 text-6xl opacity-30"></i>
            </div>
            <button onclick="document.getElementById('itemCode').value = 'SCN-' + Math.floor(Math.random()*9000); document.getElementById('scannerModal').classList.add('hidden')" class="w-full bg-emerald-600 py-2 rounded text-slate-950 font-bold text-xs">Simular Captura</button>
        </div>
    </div>

    <script>
        const vaults = Array.from({ length: 18 }, (_, i) => `ALM-${String(i + 1).padStart(2, '0')}`);
        let inventory = [{ vault: 'ALM-01', name: 'Glock 17 9mm', category: 'Arma Corta', code: 'SER-99201', qty: 1 }, { vault: 'ALM-01', name: 'Munición 9mm', category: 'Munición', code: 'LOT-2026', qty: 5000 }];
        let historyLogs = [];

        document.addEventListener('DOMContentLoaded', () => {
            const sels = ['currentVault', 'modalSourceVault', 'modalDestVault'];
            vaults.forEach(v => sels.forEach(s => document.getElementById(s).innerHTML += `<option value="${v}">${v}</option>`));
            renderInventory();
        });

        function renderInventory() {
            const v = document.getElementById('currentVault').value;
            const filtered = v === 'ALL' ? inventory : inventory.filter(i => i.vault === v);
            
            let wpns = 0, ammo = 0;
            const tbody = document.getElementById('inventoryTableBody');
            tbody.innerHTML = '';
            
            filtered.forEach(i => {
                if(i.category==='Munición') ammo += i.qty; else wpns += i.qty;
                tbody.innerHTML += `<tr><td class="p-2 text-emerald-400">${i.vault}</td><td class="p-2">${i.name}</td><td class="p-2 text-slate-400">${i.code}</td><td class="p-2 text-right">${i.qty}</td></tr>`;
            });
            document.getElementById('totalWeaponsCount').innerText = wpns;
            document.getElementById('totalAmmoCount').innerText = ammo;
        }

        function openTransactionModal(type) {
            document.getElementById('transType').value = type;
            document.getElementById('modalTitle').innerText = type;
            document.getElementById('destVaultContainer').style.display = type === 'TRASLADO' ? 'block' : 'none';
            document.getElementById('transModal').classList.remove('hidden');
        }

        function submitTransaction(e) {
            e.preventDefault();
            const type = document.getElementById('transType').value;
            const sv = document.getElementById('modalSourceVault').value;
            const dv = document.getElementById('modalDestVault').value;
            const name = document.getElementById('itemName').value;
            const qty = parseInt(document.getElementById('itemQty').value);
            
            if(type === 'ENTRADA') inventory.push({ vault: sv, name, category: document.getElementById('itemCategory').value, code: document.getElementById('itemCode').value, qty });
            else if(type === 'SALIDA') inventory = inventory.filter(i => !(i.vault === sv && i.name === name)); // Simplificado para prototipo
            else if(type === 'TRASLADO') inventory.push({ vault: dv, name, category: 'Traslado', code: document.getElementById('itemCode').value, qty });

            if(type === 'SALIDA' && qty > 1000) {
                document.getElementById('aiAnomalyText').innerText = `Salida inusual detectada: ${qty} unidades en ${sv}.`;
                document.getElementById('aiAnomalyBox').classList.remove('hidden');
            }

            historyLogs.push({ time: new Date().toLocaleTimeString(), type, route: type==='TRASLADO'?`${sv}->${dv}`:sv, item: name, qty });
            document.getElementById('historyTableBody').innerHTML = historyLogs.map(l => `<tr><td class="p-2">${l.time}</td><td class="p-2">${l.type}</td><td class="p-2">${l.route}</td><td class="p-2">${l.item}</td><td class="p-2">${l.qty}</td></tr>`).join('');
            
            renderInventory();
            document.getElementById('transModal').classList.add('hidden');
        }

        function switchTab(t) {
            document.getElementById('inventoryTabView').style.display = t === 'inventory' ? 'block' : 'none';
            document.getElementById('historyTabView').style.display = t === 'history' ? 'block' : 'none';
        }

        function handleAIChat(e) {
            e.preventDefault();
            const input = document.getElementById('aiQueryInput');
            const chat = document.getElementById('chatHistory');
            chat.innerHTML += `<div class="bg-slate-800 p-2 rounded text-right"><p>${input.value}</p></div>`;
            setTimeout(() => {
                chat.innerHTML += `<div class="bg-slate-800/80 p-2 border-l-2 border-emerald-500"><p class="text-emerald-400">IA:</p><p>Procesando consulta táctica sobre inventario...</p></div>`;
            }, 500);
            input.value = '';
        }
        function dismissAnomaly() { document.getElementById('aiAnomalyBox').classList.add('hidden'); }
    </script>
</body>
</html>
